# Demo policy. Personas (mock issuer): alice = engineering+admins @example.com,
# bob = engineering @example.com, carol = finance @example.org.
listen: ":8080"
admin_listen: ":9090"            # /healthz /readyz /metrics — keep this port private
public_url: http://localhost:8080

oidc:
  issuer: http://localhost:9000  # must equal the iss claim
  client_id: ztg
  client_secret_env: ZTG_CLIENT_SECRET
  # Browser-facing vs. back-channel URLs differ inside compose, so set them explicitly
  # (omit all three to use OIDC discovery).
  authorization_endpoint: http://localhost:9000/authorize
  token_endpoint: http://mockidp:9000/token
  jwks_uri: http://mockidp:9000/jwks
  algorithms: [ES256, RS256]
  leeway: 30s
  jwks_min_refresh: 2s

session:
  ttl: 15m
  secure: false                  # demo runs on plain http://localhost; ALWAYS true in production
  keys_env: ZTG_SESSION_KEYS

upstreams:
  app:
    url: https://app:8443
    ca_file: /certs/ca.pem
    cert_file: /certs/gateway.pem
    key_file: /certs/gateway-key.pem
    timeout: 15s
  admin:
    url: https://admin:8443
    ca_file: /certs/ca.pem
    cert_file: /certs/gateway.pem
    key_file: /certs/gateway-key.pem
    timeout: 15s

routes:
  - name: public
    match: { path_prefix: /public }
    upstream: app
    public: true

  - name: admin
    match: { path_prefix: /admin, methods: [GET, POST, DELETE] }
    upstream: admin
    strip_prefix: true
    deny:
      - name: no-unverified-email
        claims: { email_verified: false }
    allow:
      - name: admins-full-access
        groups: [admins]
      - name: engineers-read-only
        groups: [engineering]
        methods: [GET]

  - name: finance
    match: { path_prefix: /finance }
    upstream: app
    allow:
      - name: finance-team
        groups: [finance]

  - name: app
    match: { path_prefix: / }
    upstream: app
    allow:
      - name: employees
        email_domains: [example.com]
